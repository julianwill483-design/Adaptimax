<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptimax – Flexibel. Praktisch. Gut.</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #172332;
        background: #f7f9fb;
        font-family: Arial, sans-serif;
      }

      header {
        position: absolute;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px max(24px, calc((100% - 1080px) / 2));
      }

      .logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      nav a {
        padding: 10px 14px;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        transition: background-color 160ms ease;
      }

      nav a:hover,
      nav a[aria-current="page"] {
        background: rgba(255, 255, 255, 0.18);
      }

      .hero {
        display: flex;
        min-height: 100vh;
        align-items: center;
        padding: 140px max(24px, calc((100% - 1080px) / 2)) 80px;
        color: #fff;
        background:
          linear-gradient(90deg, rgba(8, 22, 37, 0.83), rgba(8, 22, 37, 0.25)),
          url("img/background_1.jpg") center / cover no-repeat;
      }

      .hero-content {
        max-width: 600px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #a9defa;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(42px, 7vw, 72px);
        line-height: 1.05;
      }

      .hero-content > p:not(.eyebrow) {
        max-width: 500px;
        margin: 0;
        color: #e3eaf0;
        font-size: 18px;
        line-height: 1.7;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        display: inline-block;
        padding: 13px 20px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        background: #0878b9;
        border: 1px solid #0878b9;
        border-radius: 7px;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .button:hover {
        background: #05649b;
        transform: translateY(-2px);
      }

      .button-secondary {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.7);
      }

      .button-secondary:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      @media (max-width: 600px) {
        header {
          align-items: flex-start;
          padding: 12px 16px;
        }

        .logo {
          width: 48px;
          height: 48px;
        }

        nav {
          justify-content: flex-end;
          gap: 2px;
        }

        nav a {
          padding: 9px 8px;
          font-size: 14px;
        }

        .hero {
          padding: 120px 24px 64px;
        }

        .hero-content > p:not(.eyebrow) {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="home.html" aria-label="Adaptimax Startseite">
        <img class="logo" src="img/logo_2.png" alt="Adaptimax" />
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="home.html" aria-current="page">Home</a>
        <a href="products.html">Bundles</a>
        <a href="about.html">Über uns</a>
        <a href="contact.html">Kontakt</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <p class="eyebrow">Adaptimax</p>
          <h1>Flexibel.<br />Praktisch. Gut.</h1>
          <p>Entdecke durchdachte Lösungen und passende Bundles, die deinen Alltag einfacher machen.</p>
          <div class="hero-actions">
            <a class="button" href="products.html">Bundles entdecken</a>
            <a class="button button-secondary" href="about.html">Mehr über uns</a>
          </div>
        </div>
      </section>

    </main>
  </body>
</html>
